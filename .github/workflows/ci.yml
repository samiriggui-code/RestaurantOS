name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            app.pizzeria.fr/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install web dependencies
        run: npm ci
        working-directory: app.pizzeria.fr
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - name: Lint server
        run: npx eslint . --ext .ts --max-warnings=0
        working-directory: server
        continue-on-error: true
      - name: Lint web
        run: npm run lint
        working-directory: app.pizzeria.fr
        continue-on-error: true
      - name: TypeScript check server
        run: npx tsc --noEmit
        working-directory: server
      - name: TypeScript check web
        run: npm run typecheck
        working-directory: app.pizzeria.fr

  test:
    name: Test server
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurantos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - name: Push database schema
        run: npx prisma db push
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/restaurantos_test
      - name: Run server tests
        run: npm test -- --coverage
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/restaurantos_test
          JWT_SECRET: test-jwt-secret-for-ci
          REFRESH_SECRET: test-refresh-secret-for-ci
          NODE_ENV: test

  build:
    name: Build
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            app.pizzeria.fr/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - name: Build server
        run: npm run build
        working-directory: server
      - name: Install web dependencies
        run: npm ci
        working-directory: app.pizzeria.fr
      - name: Build web (Next.js)
        run: npm run build
        working-directory: app.pizzeria.fr
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
